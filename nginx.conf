# ──────────────────────────────────────────────────────────────────────
# Nginx Configuration for GoDaddy VPS
# Place at: /etc/nginx/conf.d/default.conf
# ──────────────────────────────────────────────────────────────────────

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name dataanalogy.com www.dataanalogy.com;

    # For Let's Encrypt certificate verification (uncomment during first setup)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name dataanalogy.com www.dataanalogy.com;

    # SSL certificates (use Let's Encrypt - free!)
    # Get certs with: certbot certonly --nginx -d dataanalogy.com -d www.dataanalogy.com
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Next.js app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files caching
    location /_next/static/ {
        proxy_pass http://app:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Public files caching
    location /public/ {
        proxy_pass http://app:3000;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Max upload size
    client_max_body_size 10M;
}
